server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: false
        secure: false

spring:
  application:
    name: ratings-service
  datasource:
    url: jdbc:h2:mem:ratings;DB_CLOSE_DELAY=-1
    username: ${SPRING_DATASOURCE_USERNAME:ratings_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

northgate:
  export:
    dir: /var/northgate/exports
  warehouse:
    base-url: http://10.42.8.15:8081
    user: ${NORTHGATE_WAREHOUSE_USER:}
    password: ${NORTHGATE_WAREHOUSE_PASSWORD:}
    api-token: ${NORTHGATE_WAREHOUSE_API_TOKEN:}
  ops:
    console-password-hash: ${NORTHGATE_OPS_CONSOLE_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
