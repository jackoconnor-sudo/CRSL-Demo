server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

spring:
  application:
    name: ratings-service
  datasource:
    url: jdbc:h2:mem:ratings;DB_CLOSE_DELAY=-1
    username: ratings_app
    password: ${RATINGS_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

northgate:
  export:
    dir: /var/northgate/exports
  warehouse:
    base-url: http://10.42.8.15:8081
    user: ${NORTHGATE_WAREHOUSE_USER:}
    password: ${NORTHGATE_WAREHOUSE_PASSWORD:}
    api-token: ${NORTHGATE_WAREHOUSE_API_TOKEN:}
  session:
    # Base64 HMAC key shared by every replica. Sessions are rejected when the key changes.
    secret: ${NORTHGATE_SESSION_SECRET:}
  ops-console:
    # PBKDF2 credential in the form produced by LegacyDigest.hashPassword: <iterations>$<salt>$<hash>.
    password-hash: ${NORTHGATE_OPS_CONSOLE_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
