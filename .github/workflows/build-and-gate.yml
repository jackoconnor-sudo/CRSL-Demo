name: build-and-gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Build container image
        run: docker build -f ratings-service/Dockerfile -t northgate/ratings-service:${{ github.sha }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ratings-service-jar
          path: ratings-service/target/ratings-service.jar

  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that the scanner exports still match the code
        run: |
          python3 security/generate_findings.py
          git diff --exit-code security/ || {
            echo "::error::security/ exports are stale. Run python3 security/generate_findings.py and commit the result."
            exit 1
          }

      - name: Security gate
        run: python3 security/gate_check.py

      - name: Publish gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: security/gate-report.json
