# Placeholder values only. Copy to secret.yaml and fill in real values from the
# secret manager; never commit the populated file. The application reads these via
# northgate.warehouse.* and northgate.ops.console-password-hash in application.yml.
apiVersion: v1
kind: Secret
metadata:
  name: ratings-warehouse
  namespace: northgate
type: Opaque
stringData:
  NORTHGATE_WAREHOUSE_USER: <warehouse-service-account>
  NORTHGATE_WAREHOUSE_PASSWORD: <warehouse-service-account-password>
  NORTHGATE_WAREHOUSE_API_TOKEN: <warehouse-api-token>
  NORTHGATE_OPS_CONSOLE_PASSWORD_HASH: <ops-console-password-hash>
  NORTHGATE_ADMIN_TOKEN: <internal-admin-token>
  NORTHGATE_SESSION_SECRET: <random-32-byte-session-secret>
